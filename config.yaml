dataDir: /app/data

autoApprove:
  replyMax: 35
  supportMax: 25
  postMax: 0
  followbackMax: 0

video:
  provider: replicate
  defaultPlatform: instagram
  profile:
    durationSeconds: 8
    width: 720
    height: 1280
    fps: 24
  quality:
    minDurationSeconds: 6
    maxDurationSeconds: 12
    minWidth: 540
    minHeight: 960
  replicate:
    enabled: true
    model: kwaivgi/kling-v2.1

deploy:
  appPort: 3000

billing:
  actions:
    draft.post: 1
    draft.reply: 1
    draft.support: 1
    draft.blog: 3
    draft.youtube: 3
    draft.instagram: 2
    draft.follow-back: 1
    video.plan: 5
    video.render: 20
  packages:
    - id: starter
      tokens: 100
      label: Starter 100
    - id: growth
      tokens: 500
      label: Growth 500
    - id: studio
      tokens: 2000
      label: Studio 2000
